name: Scheduled ZM Report Mailer

on:
  schedule:
    # Runs every day at 14:30 IST (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-mailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          python -m pip install --upgrade pip
          pip install pandas requests python-docx slack_sdk dataframe_image
          
      - name: Execute Autonomous Mailer & Slack Bot
        env:
          EMAIL_APP_PASS: ${{ secrets.EMAIL_APP_PASS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python automated_mailer.py
